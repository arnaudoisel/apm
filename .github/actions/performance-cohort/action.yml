name: Matched performance cohort
description: Require identical identities from all three actual test runners before pytest.
inputs:
  cohort:
    description: Suite, run attempt and binary identifying this paired cohort.
    required: true
  member:
    description: baseline-1, proposed-1 or proposed-2.
    required: true
  source-sha:
    description: Exact source commit being executed.
    required: true
  selection:
    description: Complete marker and root selection shared by all members.
    required: true
  candidate-metadata:
    description: Native archive metadata for integration; empty for source unit tests.
    default: ''
runs:
  using: composite
  steps:
    - name: Record this actual test runner
      shell: bash
      env:
        COHORT: ${{ inputs.cohort }}
        MEMBER: ${{ inputs.member }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        SELECTION: ${{ inputs.selection }}
        CANDIDATE_METADATA: ${{ inputs.candidate-metadata }}
      run: |
        args=()
        if [ -n "$CANDIDATE_METADATA" ]; then
          args+=(--candidate-metadata "$CANDIDATE_METADATA")
        fi
        python -m scripts.performance_cohort record \
          --cohort "$COHORT" --member "$MEMBER" \
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
          --source-sha "$SOURCE_SHA" --selection "$SELECTION" \
          --output ".performance-cohort-out/$MEMBER.json" "${args[@]}"
    - name: Publish runner identity
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: performance-cohort-${{ inputs.cohort }}-${{ inputs.member }}
        path: .performance-cohort-out/${{ inputs.member }}.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 30
    - name: Wait for all actual paired runners
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COHORT: ${{ inputs.cohort }}
      with:
        script: |
          const { waitForCohort } = require('./scripts/performance-cohort.cjs');
          await waitForCohort({
            github, context, cohort: process.env.COHORT,
            attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
          });
    - name: Download complete cohort
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: performance-cohort-${{ inputs.cohort }}-*
        path: .performance-cohort-inputs
        merge-multiple: true
    - name: Reject different images, dependencies or candidates before execution
      shell: bash
      env:
        COHORT: ${{ inputs.cohort }}
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: |
        python -m scripts.performance_cohort verify \
          --root .performance-cohort-inputs --cohort "$COHORT" \
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
          --source-sha "$SOURCE_SHA"
