name: Read-only Release Sharding Rehearsal

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-release-rehearsal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan release rehearsal
    if: contains(github.event.pull_request.labels.*.name, 'ci-release-rehearsal')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - id: matrix
        name: Derive all five native controls and the three paired surfaces
        run: python -m scripts.release_rehearsal matrix >> "$GITHUB_OUTPUT"

  source-checks:
    name: Candidate Source Checks
    needs: [plan]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  platforms:
    name: ${{ matrix.binary_name }}
    needs: [plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/release-platform.yml
    permissions:
      contents: read
      actions: read
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      binary-name: ${{ matrix.binary_name }}
      integration-markers: ${{ matrix.integration_markers }}
      integration-shard-count: ${{ matrix.integration_shard_count }}
      integration-xdist-workers: ${{ matrix.integration_xdist_workers }}
      integration-splitting-algorithm: ${{ matrix.integration_splitting_algorithm }}
      full-validation: true
      unit-performance-probe: ${{ matrix.unit_performance_probe }}
      integration-performance-probe: ${{ matrix.integration_performance_probe }}
      performance-workers: ${{ matrix.performance_workers }}

  docs:
    name: Read-only documentation build
    needs: [plan]
    uses: ./.github/workflows/docs-build.yml
    permissions:
      contents: read
    with:
      pages_artifact_name: rehearsal-docs-${{ github.run_attempt }}
      upload_pages_artifact: true

  wheels:
    name: Read-only Python distribution build
    needs: [plan]
    uses: ./.github/workflows/pypi-distributions.yml
    permissions:
      contents: read
    with:
      artifact_name: rehearsal-wheels-${{ github.run_attempt }}
      upload_artifact: true

  compare:
    name: Compare whole rehearsal critical paths
    needs: [plan, source-checks, platforms, docs, wheels]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      contains(github.event.pull_request.labels.*.name, 'ci-release-rehearsal')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Record current-attempt job timestamps and require production authorities
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const fs = require('node:fs');
            const { selectRequiredJobs } = require('./scripts/release-candidate.cjs');
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const params = {...context.repo, run_id: context.runId, attempt_number: attempt};
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...params, per_page: 100,
            });
            const {data: run} = await github.rest.actions.getWorkflowRunAttempt(params);
            fs.mkdirSync('rehearsal-results', {recursive: true});
            fs.writeFileSync('rehearsal-results/jobs.json', JSON.stringify({
              schema_version: 1, run_id: String(context.runId), run_attempt: attempt,
              source_sha: context.sha, run_started_at: run.run_started_at,
              created_at: run.created_at, jobs,
            }, null, 2));
            const results = JSON.parse(process.env.RESULTS);
            for (const key of ['source-checks', 'platforms', 'docs', 'wheels']) {
              if (results[key]?.result !== 'success') throw new Error(`${key} did not succeed`);
            }
            const catalog = JSON.parse(fs.readFileSync('scripts/release-platforms.json', 'utf8'));
            selectRequiredJobs(jobs, catalog);
      - name: Download current integration proofs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: performance-evidence-${{ github.run_attempt }}-apm-*
          path: performance-inputs
      - name: Download current Intel unit proofs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: performance-evidence-unit-${{ github.run_attempt }}-apm-*
          path: performance-inputs
      - name: Download actual ARM runner cohort
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: performance-cohort-integration-${{ github.run_attempt }}-apm-darwin-arm64-*
          path: cohort-inputs/arm-integration
          merge-multiple: true
      - name: Download actual Linux runner cohort
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: performance-cohort-integration-${{ github.run_attempt }}-apm-linux-x86_64-*
          path: cohort-inputs/linux-integration
          merge-multiple: true
      - name: Download actual Intel runner cohort
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: performance-cohort-unit-${{ github.run_attempt }}-apm-darwin-x86_64-*
          path: cohort-inputs/intel-units
          merge-multiple: true
      - name: Require original outcomes and measure the entire critical path
        run: >-
          python -m scripts.release_rehearsal compare
          --jobs rehearsal-results/jobs.json
          --reports performance-inputs --cohorts cohort-inputs
          --expected-sha "$GITHUB_SHA"
          --minimum-lane-gain 0.15 --minimum-overall-gain 0.10
          --output rehearsal-results/comparison.json
      - name: Preserve raw timestamps and the comparison, including missed targets
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal-comparison-${{ github.run_attempt }}
          path: rehearsal-results/
          if-no-files-found: error
          retention-days: 30
