# Tier 2 integration suite - runs only when a PR is added to the merge queue.
#
# Design (microsoft/apm#770):
#   - Tier 1 (ci.yml) runs unit tests + binary build on every PR push and on
#     every merge_group event. No secrets needed there.
#   - Tier 2 (this workflow) runs smoke + integration + release-validation
#     against the tentative merge commit that the merge queue creates.
#
# Required-check satisfaction at PR time:
#   - Branch protection requires only `gate` (from `merge-gate.yml`), which
#     aggregates all PR-time signals. The four check names produced by THIS
#     workflow (Build/Smoke/Integration/Release Validation - all Linux) are
#     not required at PR time; they only run on the `gh-readonly-queue/main/*`
#     SHA the merge queue creates, against the tentative merge commit.
#   - This workflow intentionally does NOT trigger on pull_request events.
#     Doing so would let a fork PR check out and run code with the secrets
#     declared below, which is a supply-chain attack vector. Keep this file
#     `merge_group`-only forever.
#
# Trust model:
#   - merge_group only fires when a user with write access enqueues a PR.
#   - The gh-readonly-queue/main/* ref contains the PR's code merged into
#     main and is created by GitHub, not by the contributor.
#   - Trust boundary = write-access grant, managed in repo settings.
#     Write access is granted only to vetted contributors.
#   - Fork PRs without write access never reach this workflow and never see
#     CI secrets.
#
# Binary is built inline rather than downloaded from ci.yml so this workflow
# tests exactly the merge-queue tentative merge SHA without cross-workflow
# artifact plumbing.
name: Integration Tests

env:
  PYTHON_VERSION: '3.12'

on:
  merge_group:
    branches: [ main ]
    types: [ checks_requested ]

permissions:
  contents: read

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra build

      - name: Build binary
        run: |
          chmod +x scripts/build-binary.sh
          uv run ./scripts/build-binary.sh

      - name: Package exact candidate archive
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          BINARY_NAME: apm-linux-x86_64
        run: >-
          python scripts/package_release.py pack
          --binary-name "$BINARY_NAME" --sha "$CANDIDATE_SHA"

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apm-mq-${{ github.run_attempt }}-linux-x86_64
          path: |
            release-assets/
            scripts/package_release.py
            scripts/release-platforms.json
            scripts/test-release-validation.sh
            scripts/test-dependency-integration.sh
            scripts/github-token-helper.sh
            scripts/windows/test-release-validation.ps1
            scripts/windows/test-dependency-integration.ps1
            scripts/windows/github-token-helper.ps1
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Freeze integration scheduling hints
        uses: ./.github/actions/pytest-timing
        with:
          suite: integration
          snapshot: integration-duration-snapshot-${{ github.run_attempt }}

  smoke-test:
    name: Smoke Test (Linux)
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apm-mq-${{ github.run_attempt }}-linux-x86_64

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Extract checked candidate archive
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          BINARY_NAME: apm-linux-x86_64
        run: >-
          python scripts/package_release.py verify-extract
          --binary-name "$BINARY_NAME" --sha "$CANDIDATE_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Smoke target is test_core_smoke.py: a hermetic, network-free pre-flight
      # over the README's three promises (portable / secure / governed). It
      # runs against the built binary in ~10s and fails the merge queue early
      # if the bundle is broken before the 30-min integration suite even
      # starts. The legacy test_runtime_smoke.py covers the experimental
      # `apm run` execution layer and stays in the heavy integration job
      # under requires_runtime_* markers.
      - name: Run core smoke tests
        env:
          APM_E2E_TESTS: "1"
          APM_BINARY_PATH: ${{ github.workspace }}/dist/apm-linux-x86_64/apm
        run: uv run pytest tests/integration/test_core_smoke.py -v

  scaling-guards:
    name: Scaling Guards (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # Scaling guards are hermetic, network-free tests that catch
      # O(n^2) algorithmic regressions by comparing wall-clock ratios
      # at two input sizes. They run in ~5s and need no binary or
      # secrets -- parallel with the build job for zero added latency.
      - name: Run scaling guards
        run: uv run pytest tests/benchmarks/test_scaling_guards.py -v --tb=short

  integration-tests-shard:
    name: Integration Tests Shard ${{ matrix.shard }} (Linux)
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        # 4-way sharding via pytest-split keeps wall-clock low. Each shard
        # is an independent runner so HOME-mutating tests never race
        # across shards. xdist within a shard gives an additional 2x; the
        # 4 HOME-mutating files carry an xdist_group("home_env") marker
        # so xdist serializes them on a single worker (race-safe).
        shard: [1, 2, 3, 4]
    uses: ./.github/workflows/release-integration.yml
    with:
      runner: ubuntu-24.04
      platform: linux
      binary-name: apm-linux-x86_64
      candidate-artifact-name: apm-mq-${{ github.run_attempt }}-linux-x86_64
      candidate-sha: ${{ github.sha }}
      timing-snapshot-artifact: integration-duration-snapshot-${{ github.run_attempt }}
      integration-markers: not live
      shard-count: 4
      shard-index: ${{ matrix.shard }}
      xdist-workers: 2
      timeout-minutes: 20
      artifact-prefix: mq-linux-${{ github.run_attempt }}
      runtime-prerequisites: none
      run-network-integration-tests: true
      cache-apm-fetches: true
      coverage-enabled: true
    secrets:
      GH_CLI_PAT: ${{ secrets.GH_CLI_PAT }}
      ADO_APM_PAT: ${{ secrets.ADO_APM_PAT }}

  # Fan-in job that preserves the gate-required check name
  # "Integration Tests (Linux)". Branch protection / merge-gate.yml
  # require this exact name; shard jobs above are not required directly.
  integration-tests:
    name: Integration Tests (Linux)
    needs: [integration-tests-shard, scaling-guards, smoke-test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # Coverage summary runs first (with if: always()) so we get
      # observability even when some shards fail. The shard-result
      # gate runs last so it can still fail the job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage
        run: pip install "coverage[toml]"

      - name: Download shard coverage
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integration-coverage-mq-linux-${{ github.run_attempt }}-shard-*
          path: coverage-shards/
          merge-multiple: true
        continue-on-error: true

      - name: Combine and summarise coverage
        if: always()
        run: |
          if find coverage-shards -type f -name '.coverage*' 2>/dev/null | grep -q .; then
            coverage combine coverage-shards/
            coverage json -o coverage.json
            python3 scripts/coverage-summary.py coverage.json --title "Integration Test Coverage"
          else
            echo "No coverage shard files found; skipping integration coverage summary."
          fi
        continue-on-error: true

      # Integration coverage gate -- raise this floor when baseline improves.
      # Current floor: 55% (actual ~71%, 16pt margin for community PRs).
      - name: Enforce integration coverage gate
        if: always()
        run: |
          if [ -f .coverage ]; then
            coverage report --fail-under=70
          else
            echo "ERROR: No combined coverage data -- the 'Combine and summarise coverage' step must produce .coverage before the gate can run."
            exit 1
          fi

      - name: Aggregate shard results
        run: |
          if [[ "${{ needs.integration-tests-shard.result }}" != "success" ]]; then
            echo "One or more integration test shards failed: ${{ needs.integration-tests-shard.result }}"
            exit 1
          fi
          echo "All integration test shards passed."

      - name: Aggregate scaling-guards result
        run: |
          if [[ "${{ needs.scaling-guards.result }}" != "success" ]]; then
            echo "Scaling guards failed: ${{ needs.scaling-guards.result }}"
            exit 1
          fi
          echo "Scaling guards passed."

      - name: Aggregate smoke-test result
        run: |
          if [[ "${{ needs.smoke-test.result }}" != "success" ]]; then
            echo "Smoke test failed: ${{ needs.smoke-test.result }}"
            exit 1
          fi
          echo "Smoke test passed."

  release-validation:
    name: Release Validation (Linux)
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout test scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          path: repo

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apm-mq-${{ github.run_attempt }}-linux-x86_64

      - name: Extract checked candidate archive
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          BINARY_NAME: apm-linux-x86_64
        run: >-
          python repo/scripts/package_release.py verify-extract
          --binary-name "$BINARY_NAME" --archives release-assets --sha "$CANDIDATE_SHA"

      - name: Create APM symlink for testing
        run: |
          mkdir -p isolated-release-validation
          mv dist isolated-release-validation/dist
          cd isolated-release-validation
          ln -s "$(pwd)/dist/apm-linux-x86_64/apm" "$(pwd)/apm"
          pwd >> "$GITHUB_PATH"

      - name: Prepare test scripts
        run: |
          cp -r repo/scripts isolated-release-validation/scripts

      - name: Run release validation tests
        env:
          APM_E2E_TESTS: "1"
          GITHUB_APM_PAT: ${{ secrets.GH_CLI_PAT }}
          ADO_APM_PAT: ${{ secrets.ADO_APM_PAT }}
        run: |
          cd isolated-release-validation
          chmod +x scripts/test-release-validation.sh
          ./scripts/test-release-validation.sh
        timeout-minutes: 20
