name: PR Windows Installer Proof

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: windows-installer-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  BASELINE_VERSION: v0.28.0

jobs:
  windows-installer-proof:
    name: Windows installer proof
    if: github.event.label.name == 'ci-windows-installer-proof'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Require fresh proof attempt
        shell: pwsh
        run: |
          if ($env:GITHUB_RUN_ATTEMPT -ne '1') {
            throw "Use a fresh labelled run, not a partial or mixed-attempt rerun"
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra build
      - name: Build unsigned Windows candidate
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ''
        run: uv run --frozen --no-sync pwsh scripts/windows/build-binary.ps1
      - name: Package exact Windows candidate archive
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          BINARY_NAME: apm-windows-x86_64
        run: >-
          python scripts/package_release.py pack
          --binary-name "$env:BINARY_NAME" --sha "$env:CANDIDATE_SHA"
      - name: Upload standalone proof candidate archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-proof-candidate-${{ github.run_attempt }}
          path: |
            release-assets/apm-windows-x86_64.zip
            release-assets/apm-windows-x86_64.zip.sha256
            release-assets/apm-windows-x86_64.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Download historical upgrade source once
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:BASELINE_VERSION --repo microsoft/apm `
            --pattern apm-windows-x86_64.zip --pattern apm-windows-x86_64.zip.sha256 `
            --dir installer-baseline
          if ($LASTEXITCODE -ne 0) { throw "Could not download the historical upgrade source" }
      - name: Diagnose and prove Windows installer root behavior
        shell: pwsh
        run: >-
          scripts/windows/run-installer-proof.ps1
          -CandidateArchive release-assets/apm-windows-x86_64.zip
          -CandidateMetadata release-assets/apm-windows-x86_64.json
          -BaselineArchive installer-baseline/apm-windows-x86_64.zip
          -BaselineChecksum installer-baseline/apm-windows-x86_64.zip.sha256
          -BaselineVersion "$env:BASELINE_VERSION"
          -OutputDir windows-installer-proof
      - name: Upload Windows installer proof diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-proof-${{ github.run_attempt }}
          path: windows-installer-proof/
          if-no-files-found: error
          retention-days: 30
