name: CI Source Performance Probe

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: ci-source-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-compat-performance:
    name: Windows Compat Performance (${{ matrix.variant }})
    if: ${{ contains(github.event.pull_request.labels.*.name, 'ci-performance') }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            pytest_extra: ''
          - variant: proposed
            pytest_extra: '-n 2 --dist loadgroup'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Record Windows compatibility selection
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "test-results/${{ matrix.variant }}" | Out-Null
          "variant=${{ matrix.variant }}" | Set-Content -Encoding utf8 "test-results/${{ matrix.variant }}/selection.txt"
          "pytest_extra=${{ matrix.pytest_extra }}" | Add-Content -Encoding utf8 "test-results/${{ matrix.variant }}/selection.txt"
          "selection=windows_compat tests/unit tests/integration/test_lifecycle_workspace_lock.py" | Add-Content -Encoding utf8 "test-results/${{ matrix.variant }}/selection.txt"

      - name: Run Windows compatibility selection
        shell: pwsh
        run: >-
          uv run --frozen --no-sync --extra dev python -m pytest -p no:cacheprovider
          -p scripts.pytest_performance_evidence
          -v
          -m windows_compat
          tests/unit
          tests/integration/test_lifecycle_workspace_lock.py
          ${{ matrix.pytest_extra }}
          --durations=50
          --store-durations
          --junitxml=test-results/${{ matrix.variant }}/windows.xml

      - name: Capture comparable proof
        if: always()
        shell: pwsh
        run: >-
          python -m scripts.compare_test_runs capture
          --junit test-results/${{ matrix.variant }}/windows.xml
          --output test-results/${{ matrix.variant }}/proof.json
          --source-sha "$env:GITHUB_SHA"
          --selection 'windows_compat tests/unit tests/integration/test_lifecycle_workspace_lock.py'
          --variant ${{ matrix.variant }}
          --shard 1
          --shard-count 1

      - name: Preserve timing file with mode
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ".test_durations") {
            Copy-Item ".test_durations" "test-results/${{ matrix.variant }}/.test_durations"
          }

      - name: Upload Windows compatibility performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-compat-performance-${{ matrix.variant }}-${{ github.run_attempt }}
          path: test-results/${{ matrix.variant }}/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  compare-windows-compat-performance:
    name: Compare Windows Compat Performance
    if: ${{ always() && contains(github.event.pull_request.labels.*.name, 'ci-performance') }}
    needs: [windows-compat-performance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require benchmark variants succeeded
        run: |
          if [ "${{ needs.windows-compat-performance.result }}" != "success" ]; then
            echo "::error::Windows compatibility benchmark variants did not both succeed: ${{ needs.windows-compat-performance.result }}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download baseline proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-compat-performance-baseline-${{ github.run_attempt }}
          path: performance-inputs/baseline

      - name: Download proposed proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-compat-performance-proposed-${{ github.run_attempt }}
          path: performance-inputs/proposed

      - name: Compare equivalent Windows compatibility runs
        run: >-
          python -m scripts.compare_test_runs compare
          --baseline performance-inputs/baseline/proof.json
          --proposed performance-inputs/proposed/proof.json
          --expected-sha "$GITHUB_SHA"
          --minimum-speedup 0.05
          --output performance-comparison/comparison.json

      - name: Upload Windows compatibility comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-compat-performance-comparison-${{ github.run_attempt }}
          path: performance-comparison/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
