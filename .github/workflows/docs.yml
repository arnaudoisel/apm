name: Deploy Docs

on:
  # Deploy docs only when a new APM version is released, so the published
  # site always matches the latest released binary (see microsoft/apm#641).
  # This wrapper delegates all rendering and checks to docs-build.yml. The
  # release pipeline calls docs-build.yml directly for read-only prebuilds,
  # keeping Pages/OIDC permissions out of that reusable call chain.
  # release: published does not fire when the release is created by
  # GITHUB_TOKEN -- a documented Actions safeguard against recursion.
  # The release: published trigger is kept as a safety net for human-cut
  # releases. PR runs build (no deploy) to catch breakage before merge.
  # Manual workflow_dispatch is supported for re-publishing the current docs.
  release:
    types: [published]
  pull_request:
    paths:
      - 'docs/**'
      - 'src/apm_cli/cli.py'
      - 'src/apm_cli/commands/**'
      - 'scripts/check_cli_docs.py'
      - 'tests/unit/test_cli_docs_contract.py'
      - 'tests/integration/test_cli_docs_contract.py'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after building docs. Set false for read-only timing.'
        required: false
        type: boolean
        default: true
      pages_artifact_name:
        description: 'Name for the uploaded Pages artifact.'
        required: false
        type: string
        default: github-pages
      upload_pages_artifact:
        description: 'Upload the rendered docs as a Pages artifact.'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs Artifact
    uses: ./.github/workflows/docs-build.yml
    permissions:
      contents: read
    with:
      pages_artifact_name: ${{ inputs.pages_artifact_name || 'github-pages' }}
      upload_pages_artifact: >-
        ${{
          (github.event_name == 'workflow_dispatch' && inputs.upload_pages_artifact != false) ||
          (github.event_name == 'release' && github.event.release.prerelease == false)
        }}

  deploy:
    needs: build
    # Only stable releases (or manual dispatch) update the public docs site,
    # so prerelease tags (vX.Y.Z-rc1, etc.) don't clobber published docs.
    if: >-
      always() && !cancelled() && needs.build.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && inputs.deploy != false) ||
       (github.event_name == 'release' && github.event.release.prerelease == false))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: ${{ inputs.pages_artifact_name || 'github-pages' }}
