name: Baseline Release Comparison

env:
  PYTHON_VERSION: '3.12'  # Standardize on 3.12 for Ubuntu 24.04 LTS compatibility
  BASELINE_FROZEN_MAIN_SHA: 3162f7047c2585806cc9283044bad71a8b72f77a
  BASELINE_FROZEN_WORKFLOW_BLOB: b16710dad3a0e1fb35568a6a0b836b4e58112bbe
  BASELINE_FROZEN_WORKFLOW_SHA256: 1263318ba5b3e8938bad859ba7b09cb1d791887d74eda044b3cda25251401e80
  BASELINE_TOOLING_SHA: PARENT_PROVIDED_TOOLING_SHA

on:
  push:
    branches: [ danielmeppiel-release-baseline-clock ]

# Restrict default GITHUB_TOKEN permissions for all jobs (principle of least privilege)
permissions:
  contents: read

jobs:
  # Baseline adapter over the frozen-main build-release workflow.
  # Runtime checkouts use BASELINE_FROZEN_MAIN_SHA. This controller branch only
  # changes trigger, credential, publication, observer, and verification wiring.

  # Unit tests + smoke tests + binary build combined (Linux + Windows).
  # Merging test+build eliminates ~1.5m runner re-provisioning overhead per platform.
  # macOS runners are scarce and have their own consolidated jobs below.
  build-and-test:
    name: Build & Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            platform: linux
            binary_name: apm-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux
            binary_name: apm-linux-arm64
          - os: windows-latest
            arch: x86_64
            platform: windows
            binary_name: apm-windows-x86_64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_FROZEN_MAIN_SHA }}
          persist-credentials: false

      - name: Verify frozen source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${BASELINE_FROZEN_MAIN_SHA}"

      - name: Guard baseline tooling SHA
        shell: bash
        run: |
          if [ "${BASELINE_TOOLING_SHA}" = "PARENT_PROVIDED_TOOLING_SHA" ] || [ -z "${BASELINE_TOOLING_SHA}" ]; then
            echo "::error::BASELINE_TOOLING_SHA must be replaced with the parent-provided tooling commit before this workflow is run."
            exit 1
          fi

      - name: Checkout wall-clock tooling
        shell: bash
        run: |
          git init "${RUNNER_TEMP}/wallclock-tooling"
          git -C "${RUNNER_TEMP}/wallclock-tooling" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${RUNNER_TEMP}/wallclock-tooling" fetch --depth=1 origin "${BASELINE_TOOLING_SHA}"
          git -C "${RUNNER_TEMP}/wallclock-tooling" checkout --detach FETCH_HEAD

      - name: Install baseline pytest evidence plugin
        shell: bash
        run: |
          cp \
            "${RUNNER_TEMP}/wallclock-tooling/scripts/pytest_performance_evidence.py" \
            "${GITHUB_WORKSPACE}/_apm_wallclock_evidence.py"

      - name: Record baseline job observer
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/wallclock-job"
          cd "${RUNNER_TEMP}/wallclock-tooling"
          python -m scripts.release_wallclock record-job \
            --side baseline \
            --source-root "${GITHUB_WORKSPACE}" \
            --source-sha "${BASELINE_FROZEN_MAIN_SHA}" \
            --output "${RUNNER_TEMP}/wallclock-job/${{ matrix.binary_name }}-build-and-test-job.json"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra build

      - name: Prepare baseline test output directory
        shell: bash
        run: mkdir -p "${RUNNER_TEMP}/wallclock-junit"

      # Keep the installer gate ahead of the broad unit suite so an unrelated
      # platform test failure cannot hide installer-specific Windows evidence.
      - name: Test install.ps1 end-to-end (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          APM_E2E_TESTS: "1"
        run: >-
          uv run --frozen python -m pytest
          tests/integration/test_windows_installer_launchers.py
          -p _apm_wallclock_evidence
          --junitxml "${env:RUNNER_TEMP}\wallclock-junit\${{ matrix.binary_name }}-installer.xml"
          -vv -ra --tb=short

      - name: Run unit tests
        if: matrix.platform != 'windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python -m pytest tests/unit tests/test_console.py -n auto --dist worksteal
          -p _apm_wallclock_evidence
          --junitxml "${RUNNER_TEMP}/wallclock-junit/${{ matrix.binary_name }}-unit.xml"

      # Named starts/outcomes identify unfinished tests without dumping captures.
      # This bounds an opaque hang; it does not turn a timeout into success.
      - name: Run unit tests (Windows diagnostics)
        if: matrix.platform == 'windows'
        timeout-minutes: 60
        env:
          PYTHONUNBUFFERED: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python -m pytest tests/unit tests/test_console.py -n auto --dist worksteal
          -p _apm_wallclock_evidence
          -vv --tb=short --show-capture=no --no-showlocals
          --junitxml "${env:RUNNER_TEMP}\wallclock-junit\${{ matrix.binary_name }}-unit.xml"

      - name: Run smoke tests (Unix)
        if: matrix.platform != 'windows'
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python -m pytest tests/integration/test_runtime_smoke.py -v
          -p _apm_wallclock_evidence
          --junitxml "${RUNNER_TEMP}/wallclock-junit/${{ matrix.binary_name }}-smoke.xml"

      - name: Run smoke tests (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          uv run python -m pytest tests/integration/test_runtime_smoke.py -v
          -p _apm_wallclock_evidence
          --junitxml "${env:RUNNER_TEMP}\wallclock-junit\${{ matrix.binary_name }}-smoke.xml"

      - name: Install UPX (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Build binary (Unix)
        if: matrix.platform != 'windows'
        run: |
          chmod +x scripts/build-binary.sh
          uv run ./scripts/build-binary.sh

      - name: Build binary (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          uv run pwsh scripts/windows/build-binary.ps1

      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.binary_name }}
          path: |
            ./dist/${{ matrix.binary_name }}
            ./dist/${{ matrix.binary_name }}.sha256
            ./scripts/test-release-validation.sh
            ./scripts/windows/test-release-validation.ps1
            ./scripts/test-dependency-integration.sh
            ./scripts/windows/test-dependency-integration.ps1
            ./scripts/github-token-helper.sh
            ./scripts/windows/github-token-helper.ps1
          include-hidden-files: true  # Required to include .apm directories
          retention-days: 30
          if-no-files-found: error

      - name: Upload baseline test output inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-test-output-${{ matrix.binary_name }}
          path: |
            ${{ runner.temp }}/wallclock-junit
            ${{ runner.temp }}/wallclock-job
          if-no-files-found: ignore

  # Consolidated macOS Intel build + validation.
  # Intel runners are plentiful (<1 min queue) so this runs on every push for
  # early macOS build-regression feedback. The baseline runs integration and
  # release-validation unconditionally as part of the read-only promotion path.
  # Root node - runs its own unit tests instead of waiting for build-and-test.
  build-and-validate-macos-intel:
    name: Build & Validate (macOS x86_64)
    runs-on: macos-15-intel
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_FROZEN_MAIN_SHA }}
          persist-credentials: false

      - name: Verify frozen source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${BASELINE_FROZEN_MAIN_SHA}"

      - name: Guard baseline tooling SHA
        run: |
          if [ "${BASELINE_TOOLING_SHA}" = "PARENT_PROVIDED_TOOLING_SHA" ] || [ -z "${BASELINE_TOOLING_SHA}" ]; then
            echo "::error::BASELINE_TOOLING_SHA must be replaced with the parent-provided tooling commit before this workflow is run."
            exit 1
          fi

      - name: Checkout wall-clock tooling
        run: |
          git init "${RUNNER_TEMP}/wallclock-tooling"
          git -C "${RUNNER_TEMP}/wallclock-tooling" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${RUNNER_TEMP}/wallclock-tooling" fetch --depth=1 origin "${BASELINE_TOOLING_SHA}"
          git -C "${RUNNER_TEMP}/wallclock-tooling" checkout --detach FETCH_HEAD

      - name: Install baseline pytest evidence plugin
        run: |
          cp \
            "${RUNNER_TEMP}/wallclock-tooling/scripts/pytest_performance_evidence.py" \
            "${GITHUB_WORKSPACE}/_apm_wallclock_evidence.py"

      - name: Record baseline job observer
        run: |
          mkdir -p "${RUNNER_TEMP}/wallclock-job"
          cd "${RUNNER_TEMP}/wallclock-tooling"
          python -m scripts.release_wallclock record-job \
            --side baseline \
            --source-root "${GITHUB_WORKSPACE}" \
            --source-sha "${BASELINE_FROZEN_MAIN_SHA}" \
            --output "${RUNNER_TEMP}/wallclock-job/apm-darwin-x86_64-build-validate-job.json"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup build environment
        run: |
          sudo xcode-select --install 2>/dev/null || true
          until xcode-select -p >/dev/null 2>&1; do sleep 5; done

      - name: Install UPX
        run: brew install upx

      - name: Install Unix shell startup test runtimes
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          brew list fish >/dev/null 2>&1 || brew install fish

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra build

      - name: Prepare baseline test output directory
        run: mkdir -p "${RUNNER_TEMP}/wallclock-junit"

      - name: Run unit tests
        run: >-
          uv run python -m pytest tests/unit tests/test_console.py -n auto --dist worksteal
          -p _apm_wallclock_evidence
          --junitxml "${RUNNER_TEMP}/wallclock-junit/apm-darwin-x86_64-unit.xml"

      # PHASE 1: BUILD BINARY
      - name: Build binary
        run: |
          chmod +x scripts/build-binary.sh
          uv run ./scripts/build-binary.sh

      - name: Test macOS non-shell binary startup
        env:
          APM_E2E_TESTS: "1"
          APM_BINARY_PATH: ${{ github.workspace }}/dist/apm-darwin-x86_64/apm
        run: |
          test -x "$APM_BINARY_PATH"
          uv run --frozen python -m pytest \
            tests/integration/test_core_smoke.py::TestBinaryStartup::test_apm_version_runs \
            tests/integration/test_core_smoke.py::TestBinaryStartup::test_apm_rich_table_runs \
            -p _apm_wallclock_evidence \
            -vv -ra --tb=short \
            --junitxml "${RUNNER_TEMP}/wallclock-junit/apm-darwin-x86_64-startup.xml"

      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apm-darwin-x86_64
          path: |
            ./dist/apm-darwin-x86_64
            ./dist/apm-darwin-x86_64.sha256
            ./scripts/test-release-validation.sh
            ./scripts/test-dependency-integration.sh
            ./scripts/github-token-helper.sh
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      # PHASE 2: FOCUSED INTEGRATION TESTS
      - name: Run focused Intel integration tests
        env:
          APM_E2E_TESTS: "1"
          GITHUB_API_TOKEN: ${{ github.token }}
          # Intel validates the promoted lifecycle subset against its native
          # binary. Live credential acceptance belongs to auth-acceptance.yml.
          # loadgroup preserves HOME-mutating test serialization.
          PYTEST_MARK_EXPR: "lifecycle_smoke and not live"
          PYTEST_EXTRA_ARGS: "-n 4 --dist loadgroup -p _apm_wallclock_evidence --junitxml ${{ runner.temp }}/wallclock-junit/apm-darwin-x86_64-integration.xml"
        run: |
          chmod +x scripts/test-integration.sh
          uv run ./scripts/test-integration.sh
        timeout-minutes: 30

      # PHASE 3: RELEASE VALIDATION
      - name: Prepare isolated release-validation environment
        run: |
          mkdir -p /tmp/apm-isolated-test/dist
          cp -R ./dist/apm-darwin-x86_64 /tmp/apm-isolated-test/dist/
          cp ./dist/apm-darwin-x86_64.sha256 /tmp/apm-isolated-test/dist/ 2>/dev/null || true
          cp ./scripts/test-release-validation.sh /tmp/apm-isolated-test/
          cp ./scripts/test-dependency-integration.sh /tmp/apm-isolated-test/ 2>/dev/null || true
          cp ./scripts/github-token-helper.sh /tmp/apm-isolated-test/ 2>/dev/null || true

          cd /tmp/apm-isolated-test
          chmod +x ./dist/apm-darwin-x86_64/apm
          ln -s "$(pwd)/dist/apm-darwin-x86_64/apm" "$(pwd)/apm"
          echo "/tmp/apm-isolated-test" >> "$GITHUB_PATH"

      - name: Run release validation tests
        env:
          APM_E2E_TESTS: "1"
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/apm-isolated-test
          chmod +x test-release-validation.sh
          ./test-release-validation.sh
        timeout-minutes: 20

      - name: Upload baseline test output inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-test-output-apm-darwin-x86_64
          path: |
            ${{ runner.temp }}/wallclock-junit
            ${{ runner.temp }}/wallclock-job
          if-no-files-found: ignore

  # Consolidated macOS ARM build + validation.
  # ARM runners (macos-latest) are extremely scarce - 2-4+ hour queue waits are
  # common. The baseline comparison intentionally runs ARM as part of the complete
  # frozen-main promotion path.
  # Root node - runs its own unit tests instead of waiting for build-and-test.
  build-and-validate-macos-arm:
    name: Build & Validate (macOS arm64)
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_FROZEN_MAIN_SHA }}
          persist-credentials: false

      - name: Verify frozen source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${BASELINE_FROZEN_MAIN_SHA}"

      - name: Guard baseline tooling SHA
        run: |
          if [ "${BASELINE_TOOLING_SHA}" = "PARENT_PROVIDED_TOOLING_SHA" ] || [ -z "${BASELINE_TOOLING_SHA}" ]; then
            echo "::error::BASELINE_TOOLING_SHA must be replaced with the parent-provided tooling commit before this workflow is run."
            exit 1
          fi

      - name: Checkout wall-clock tooling
        run: |
          git init "${RUNNER_TEMP}/wallclock-tooling"
          git -C "${RUNNER_TEMP}/wallclock-tooling" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${RUNNER_TEMP}/wallclock-tooling" fetch --depth=1 origin "${BASELINE_TOOLING_SHA}"
          git -C "${RUNNER_TEMP}/wallclock-tooling" checkout --detach FETCH_HEAD

      - name: Install baseline pytest evidence plugin
        run: |
          cp \
            "${RUNNER_TEMP}/wallclock-tooling/scripts/pytest_performance_evidence.py" \
            "${GITHUB_WORKSPACE}/_apm_wallclock_evidence.py"

      - name: Record baseline job observer
        run: |
          mkdir -p "${RUNNER_TEMP}/wallclock-job"
          cd "${RUNNER_TEMP}/wallclock-tooling"
          python -m scripts.release_wallclock record-job \
            --side baseline \
            --source-root "${GITHUB_WORKSPACE}" \
            --source-sha "${BASELINE_FROZEN_MAIN_SHA}" \
            --output "${RUNNER_TEMP}/wallclock-job/apm-darwin-arm64-build-validate-job.json"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UPX
        run: brew install upx

      - name: Install Unix shell startup test runtimes
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          brew list fish >/dev/null 2>&1 || brew install fish

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra build

      - name: Prepare baseline test output directory
        run: mkdir -p "${RUNNER_TEMP}/wallclock-junit"

      - name: Run unit tests
        run: >-
          uv run python -m pytest tests/unit tests/test_console.py -n auto --dist worksteal
          -p _apm_wallclock_evidence
          --junitxml "${RUNNER_TEMP}/wallclock-junit/apm-darwin-arm64-unit.xml"

      # PHASE 1: BUILD BINARY
      - name: Build binary
        run: |
          chmod +x scripts/build-binary.sh
          uv run ./scripts/build-binary.sh

      - name: Test macOS non-shell binary startup
        env:
          APM_E2E_TESTS: "1"
          APM_BINARY_PATH: ${{ github.workspace }}/dist/apm-darwin-arm64/apm
        run: |
          test -x "$APM_BINARY_PATH"
          uv run --frozen python -m pytest \
            tests/integration/test_core_smoke.py::TestBinaryStartup::test_apm_version_runs \
            tests/integration/test_core_smoke.py::TestBinaryStartup::test_apm_rich_table_runs \
            -p _apm_wallclock_evidence \
            -vv -ra --tb=short \
            --junitxml "${RUNNER_TEMP}/wallclock-junit/apm-darwin-arm64-startup.xml"

      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apm-darwin-arm64
          path: |
            ./dist/apm-darwin-arm64
            ./dist/apm-darwin-arm64.sha256
            ./scripts/test-release-validation.sh
            ./scripts/test-dependency-integration.sh
            ./scripts/github-token-helper.sh
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

      # PHASE 2: INTEGRATION TESTS
      - name: Run integration tests
        env:
          APM_E2E_TESTS: "1"
          GITHUB_API_TOKEN: ${{ github.token }}
          # Scarce ARM runners force the full suite onto one runner, so
          # parallelise the non-live corpus in-process with xdist.
          # --dist loadgroup honors the
          # home_env xdist_group markers that keep HOME-mutating tests
          # serialized on a single worker.
          PYTEST_MARK_EXPR: "not live"
          PYTEST_EXTRA_ARGS: "-n 4 --dist loadgroup -p _apm_wallclock_evidence --junitxml ${{ runner.temp }}/wallclock-junit/apm-darwin-arm64-integration.xml"
        run: |
          chmod +x scripts/test-integration.sh
          uv run ./scripts/test-integration.sh
        timeout-minutes: 60

      # PHASE 3: RELEASE VALIDATION
      - name: Prepare isolated release-validation environment
        run: |
          mkdir -p /tmp/apm-isolated-test/dist
          cp -R ./dist/apm-darwin-arm64 /tmp/apm-isolated-test/dist/
          cp ./dist/apm-darwin-arm64.sha256 /tmp/apm-isolated-test/dist/ 2>/dev/null || true
          cp ./scripts/test-release-validation.sh /tmp/apm-isolated-test/
          cp ./scripts/test-dependency-integration.sh /tmp/apm-isolated-test/ 2>/dev/null || true
          cp ./scripts/github-token-helper.sh /tmp/apm-isolated-test/ 2>/dev/null || true

          cd /tmp/apm-isolated-test
          chmod +x ./dist/apm-darwin-arm64/apm
          ln -s "$(pwd)/dist/apm-darwin-arm64/apm" "$(pwd)/apm"
          echo "/tmp/apm-isolated-test" >> "$GITHUB_PATH"

      - name: Run release validation tests
        env:
          APM_E2E_TESTS: "1"
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/apm-isolated-test
          chmod +x test-release-validation.sh
          ./test-release-validation.sh
        timeout-minutes: 20

      - name: Upload baseline test output inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-test-output-apm-darwin-arm64
          path: |
            ${{ runner.temp }}/wallclock-junit
            ${{ runner.temp }}/wallclock-job
          if-no-files-found: ignore

  # Integration tests with full source code access (Linux + Windows).
  # macOS integration tests run inside the consolidated macOS jobs to avoid re-queuing scarce runners.
  # Baseline comparison runs the promotion-path Linux + Windows fanout.
  integration-tests:
    name: Integration Tests
    needs: [build-and-test]
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            platform: linux
            binary_name: apm-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux
            binary_name: apm-linux-arm64
          - os: windows-latest
            arch: x86_64
            platform: windows
            binary_name: apm-windows-x86_64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_FROZEN_MAIN_SHA }}
          persist-credentials: false

      - name: Verify frozen source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${BASELINE_FROZEN_MAIN_SHA}"

      - name: Guard baseline tooling SHA
        shell: bash
        run: |
          if [ "${BASELINE_TOOLING_SHA}" = "PARENT_PROVIDED_TOOLING_SHA" ] || [ -z "${BASELINE_TOOLING_SHA}" ]; then
            echo "::error::BASELINE_TOOLING_SHA must be replaced with the parent-provided tooling commit before this workflow is run."
            exit 1
          fi

      - name: Checkout wall-clock tooling
        shell: bash
        run: |
          git init "${RUNNER_TEMP}/wallclock-tooling"
          git -C "${RUNNER_TEMP}/wallclock-tooling" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${RUNNER_TEMP}/wallclock-tooling" fetch --depth=1 origin "${BASELINE_TOOLING_SHA}"
          git -C "${RUNNER_TEMP}/wallclock-tooling" checkout --detach FETCH_HEAD

      - name: Install baseline pytest evidence plugin
        shell: bash
        run: |
          cp \
            "${RUNNER_TEMP}/wallclock-tooling/scripts/pytest_performance_evidence.py" \
            "${GITHUB_WORKSPACE}/_apm_wallclock_evidence.py"

      - name: Record baseline job observer
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/wallclock-job"
          cd "${RUNNER_TEMP}/wallclock-tooling"
          python -m scripts.release_wallclock record-job \
            --side baseline \
            --source-root "${GITHUB_WORKSPACE}" \
            --source-sha "${BASELINE_FROZEN_MAIN_SHA}" \
            --output "${RUNNER_TEMP}/wallclock-job/${{ matrix.binary_name }}-integration-job.json"

      - name: Download APM binary from build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.binary_name }}
          path: ./

      - name: Check downloaded binary artifact
        id: artifact
        if: always()
        shell: bash
        run: |
          if [ -d "./dist/${{ matrix.binary_name }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::No ${{ matrix.binary_name }} artifact for baseline integration validation."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Unix shell startup test runtimes
        if: matrix.platform != 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y fish zsh

      - name: Install test dependencies
        run: uv sync --frozen --extra dev

      - name: Prepare baseline test output directory
        shell: bash
        run: mkdir -p "${RUNNER_TEMP}/wallclock-junit"

      - name: Run integration tests (Unix)
        if: matrix.platform != 'windows'
        env:
          APM_E2E_TESTS: "1"
          GITHUB_API_TOKEN: ${{ github.token }}
          # The tag gate runs the non-live corpus on one runner. Four workers stay
          # below the merge gate's aggregate width while loadgroup preserves
          # xdist_group serialization for HOME-mutating tests.
          PYTEST_MARK_EXPR: "not live"
          PYTEST_EXTRA_ARGS: "-n 4 --dist loadgroup -p _apm_wallclock_evidence --junitxml ${{ runner.temp }}/wallclock-junit/${{ matrix.binary_name }}-integration.xml"
        run: |
          chmod +x scripts/test-integration.sh
          uv run ./scripts/test-integration.sh
        timeout-minutes: 60

      - name: Run integration tests (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          APM_E2E_TESTS: "1"
          GITHUB_API_TOKEN: ${{ github.token }}
          PYTEST_EXTRA_ARGS: >-
            -p _apm_wallclock_evidence
            --junitxml ${{ runner.temp }}\wallclock-junit\${{ matrix.binary_name }}-integration.xml
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP "wallclock-output"
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          @"
          frozen-main script: scripts/windows/test-integration.ps1 -SkipBuild
          pytest selections inside frozen script:
          - tests/integration/test_auto_install_e2e.py -v -s --tb=short
          - tests/integration/test_mcp_registry_e2e.py -v -s --tb=short
          - tests/integration/test_apm_dependencies.py -v -s --tb=short -m integration
          - tests/integration/test_ado_e2e.py -m "live and requires_ado_pat" -v -s --tb=short only when IncludeLiveADO and ADO_APM_PAT are present
          controller note: PYTEST_EXTRA_ARGS is passed for compatibility with shared inventory, but frozen main's PowerShell script does not consume it.
          "@ | Out-File -FilePath (Join-Path $outputDir "${{ matrix.binary_name }}-integration-selection.txt") -Encoding utf8
          & uv run pwsh scripts/windows/test-integration.ps1 -SkipBuild *>&1 |
            Tee-Object -FilePath (Join-Path $outputDir "${{ matrix.binary_name }}-integration-stdout.log")
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        timeout-minutes: 20

      - name: Upload baseline test output inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-test-output-${{ matrix.binary_name }}-integration
          path: |
            ${{ runner.temp }}/wallclock-junit
            ${{ runner.temp }}/wallclock-job
            ${{ runner.temp }}/wallclock-output
          if-no-files-found: ignore

  # Release validation tests - Final baseline validation of shipped binary (Linux + Windows).
  # macOS release validation runs inside the consolidated macOS jobs.
  release-validation:
    name: Release Validation
    needs: [build-and-test, integration-tests]
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            platform: linux
            binary_name: apm-linux-x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            platform: linux
            binary_name: apm-linux-arm64
          - os: windows-latest
            arch: x86_64
            platform: windows
            binary_name: apm-windows-x86_64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download APM binary from build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.platform == 'windows' && 'D:\apm-isolated-test' || '/tmp/apm-isolated-test/' }}

      - name: Check downloaded binary artifact (Unix)
        id: artifact_unix
        if: always() && matrix.platform != 'windows'
        run: |
          if [ -d "/tmp/apm-isolated-test/dist/${{ matrix.binary_name }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::No ${{ matrix.binary_name }} artifact for baseline release validation."
            exit 1
          fi

      - name: Check downloaded binary artifact (Windows)
        id: artifact_windows
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (Test-Path "D:\apm-isolated-test\dist\${{ matrix.binary_name }}") {
            "available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Error "No ${{ matrix.binary_name }} artifact for baseline release validation."
            exit 1
          }

      - name: Make binary executable and verify isolation (Unix)
        if: matrix.platform != 'windows'
        run: |
          cd /tmp/apm-isolated-test

          # Debug: List the downloaded structure
          echo "Downloaded structure:"
          find . -name "apm" -type f
          ls -la ./dist/

          # Make the binary executable
          chmod +x ./dist/${{ matrix.binary_name }}/apm

      - name: Create APM symlink for testing (Unix)
        if: matrix.platform != 'windows'
        run: |
          cd /tmp/apm-isolated-test
          ln -s "$(pwd)/dist/${{ matrix.binary_name }}/apm" "$(pwd)/apm"
          echo "/tmp/apm-isolated-test" >> "$GITHUB_PATH"

      - name: Verify binary and add to PATH (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cd D:\apm-isolated-test

          # Debug: List the downloaded structure
          Write-Host "Downloaded structure:"
          Get-ChildItem -Recurse -Filter "apm.exe"
          Get-ChildItem .\dist\

          # Add binary directory to PATH
          $binDir = "D:\apm-isolated-test\dist\${{ matrix.binary_name }}"
          echo $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run release validation tests (Unix)
        if: matrix.platform != 'windows'
        env:
          APM_E2E_TESTS: "1"
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/apm-isolated-test
          chmod +x scripts/test-release-validation.sh
          ./scripts/test-release-validation.sh
        timeout-minutes: 20

      - name: Run release validation tests (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          APM_E2E_TESTS: "1"
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          cd D:\apm-isolated-test
          .\scripts\windows\test-release-validation.ps1
        timeout-minutes: 20

  prepare-baseline-archives:
    name: Prepare Baseline Archives
    needs: [build-and-test, build-and-validate-macos-intel, build-and-validate-macos-arm, integration-tests, release-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download baseline binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: apm-*
          path: ./dist
          merge-multiple: false

      - name: Prepare release binaries
        run: |
          # Debug: Show the actual downloaded structure
          echo "Directory listing:"
          ls -la ./dist
          echo ""

          # Create tar.gz archives from directory structure for release and Homebrew
          cd dist
          for binary in apm-linux-x86_64 apm-linux-arm64 apm-darwin-x86_64 apm-darwin-arm64; do
            # With artifacts containing both scripts and dist/, the binary is in artifact/dist/binary/
            artifact_dir="${binary}"
            binary_dir="${artifact_dir}/dist/${binary}"

            if [ -d "$binary_dir" ] && [ -f "$binary_dir/apm" ]; then
              echo "Processing $binary_dir directory..."
              # Ensure the binary is executable before archiving
              chmod +x "${binary_dir}/apm"
              # Create tar.gz with preserved permissions, archiving ONLY the binary directory for release
              tar -czf "${binary}.tar.gz" -C "${artifact_dir}/dist" "${binary}"
              if command -v sha256sum &> /dev/null; then
                sha256sum "${binary}.tar.gz" > "${binary}.tar.gz.sha256"
              elif command -v shasum &> /dev/null; then
                shasum -a 256 "${binary}.tar.gz" > "${binary}.tar.gz.sha256"
              fi
              echo "Created ${binary}.tar.gz"
            else
              echo "ERROR: Binary directory $binary_dir not found or $binary_dir/apm missing"
              echo "Artifact directory contents:"
              ls -la "$artifact_dir/" || echo "Directory $artifact_dir does not exist"
              if [ -d "$artifact_dir/dist" ]; then
                echo "Dist directory contents:"
                ls -la "$artifact_dir/dist/"
              fi
              exit 1
            fi
          done

          binary="apm-windows-x86_64"
          artifact_dir="${binary}"
          binary_dir="${artifact_dir}/dist/${binary}"
          if [ -d "$binary_dir" ] && [ -f "$binary_dir/apm.exe" ]; then
            echo "Processing $binary_dir directory..."
            (
              cd "${artifact_dir}/dist"
              zip -qr "../../${binary}.zip" "${binary}"
            )
            if command -v sha256sum &> /dev/null; then
              sha256sum "${binary}.zip" > "${binary}.zip.sha256"
            elif command -v shasum &> /dev/null; then
              shasum -a 256 "${binary}.zip" > "${binary}.zip.sha256"
            fi
            echo "Created ${binary}.zip"
          else
            echo "ERROR: Binary directory $binary_dir not found or $binary_dir/apm.exe missing"
            echo "Artifact directory contents:"
            ls -la "$artifact_dir/" || echo "Directory $artifact_dir does not exist"
            if [ -d "$artifact_dir/dist" ]; then
              echo "Dist directory contents:"
              ls -la "$artifact_dir/dist/"
            fi
            exit 1
          fi

      - name: Upload baseline platform archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-platform-archives
          path: |
            ./dist/apm-linux-x86_64.tar.gz
            ./dist/apm-linux-x86_64.tar.gz.sha256
            ./dist/apm-linux-arm64.tar.gz
            ./dist/apm-linux-arm64.tar.gz.sha256
            ./dist/apm-darwin-x86_64.tar.gz
            ./dist/apm-darwin-x86_64.tar.gz.sha256
            ./dist/apm-darwin-arm64.tar.gz
            ./dist/apm-darwin-arm64.tar.gz.sha256
            ./dist/apm-windows-x86_64.zip
            ./dist/apm-windows-x86_64.zip.sha256
          if-no-files-found: error

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    needs: [prepare-baseline-archives]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_FROZEN_MAIN_SHA }}
          persist-credentials: false

      - name: Verify frozen source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${BASELINE_FROZEN_MAIN_SHA}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'docs/package-lock.json'

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python test dependencies
        run: uv sync --frozen --extra dev

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci

      - name: Test generated-link checker
        working-directory: ./docs
        run: npm run test:links

      - name: Test CLI registry contract
        run: >-
          uv run --frozen pytest
          tests/unit/test_cli_docs_contract.py
          tests/integration/test_cli_docs_contract.py
          -q

      - name: Build documentation
        working-directory: ./docs
        run: npm run build

      - name: Check CLI registry against rendered pages
        run: uv run --frozen python scripts/check_cli_docs.py docs/dist

      - name: Verify schema $id reachability
        run: python3 scripts/check_schema_ids.py

      - name: Upload docs build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: baseline-docs-build
          path: docs/dist
          if-no-files-found: error

  build-pypi-distributions:
    name: Build PyPI Distributions
    runs-on: ubuntu-latest
    needs: [prepare-baseline-archives]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_FROZEN_MAIN_SHA }}
          persist-credentials: false

      - name: Verify frozen source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${BASELINE_FROZEN_MAIN_SHA}"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install locked build dependencies
        run: uv sync --frozen --extra dev

      - name: Build Python package
        run: uv build --no-build-isolation --no-sources

      - name: Upload Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  baseline-terminal:
    name: Verify wall-clock artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: always()
    needs:
      - build-and-test
      - build-and-validate-macos-intel
      - build-and-validate-macos-arm
      - integration-tests
      - release-validation
      - prepare-baseline-archives
      - build-docs
      - build-pypi-distributions
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_FROZEN_MAIN_SHA }}
          path: baseline-frozen-source
          persist-credentials: false

      - name: Verify frozen source checkout
        shell: bash
        run: test "$(git -C baseline-frozen-source rev-parse HEAD)" = "${BASELINE_FROZEN_MAIN_SHA}"

      - name: Guard baseline tooling SHA
        shell: bash
        run: |
          if [ "${BASELINE_TOOLING_SHA}" = "PARENT_PROVIDED_TOOLING_SHA" ] || [ -z "${BASELINE_TOOLING_SHA}" ]; then
            echo "::error::BASELINE_TOOLING_SHA must be replaced with the parent-provided tooling commit before this workflow is run."
            exit 1
          fi

      - name: Checkout wall-clock tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASELINE_TOOLING_SHA }}
          path: wallclock-tooling
          persist-credentials: false

      - name: Download baseline platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: baseline-platform-archives
          path: wallclock-native-root/archives

      - name: Download raw platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: apm-*
          path: wallclock-native-root/raw
          merge-multiple: false

      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: wallclock-python-root

      - name: Download docs build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: baseline-docs-build
          path: wallclock-docs-root

      - name: Download baseline test output inventory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: baseline-test-output-*
          path: wallclock-test-output
          merge-multiple: false

      - name: Prepare baseline adapter manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p wallclock-proof
          workflow_created_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.created_at')"
          run_started_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.run_started_at')"

          cat > wallclock-proof/baseline-adapter-manifest.json <<MANIFEST
          {
            "kind": "apm-baseline-adapter-manifest",
            "non_promotable": true,
            "frozen_source_sha": "${BASELINE_FROZEN_MAIN_SHA}",
            "frozen_workflow_blob": "${BASELINE_FROZEN_WORKFLOW_BLOB}",
            "frozen_workflow_sha256": "${BASELINE_FROZEN_WORKFLOW_SHA256}",
            "controller_definition_sha": "${GITHUB_SHA}",
            "tooling_sha": "${BASELINE_TOOLING_SHA}",
            "workflow_created_at": "${workflow_created_at}",
            "run_started_at": "${run_started_at}",
            "adaptations": [
              "trigger limited to push on danielmeppiel-release-baseline-clock",
              "all source checkouts pin ref to frozen_source_sha and disable persisted credentials",
              "tag, main, schedule, repository_dispatch, release creation, issue writing, external postpublish, PyPI publish, Pages deploy, environments, write permissions, and id-token permissions removed",
              "secret references removed; public GitHub API token paths use the default read-only github.token",
              "Windows pinned public installer test remains before broad Windows units",
              "smoke, integration, macOS validation, release-validation, archive preparation, docs build, and Python distribution build are retained as read-only baseline work",
              "archive preparation command body is preserved from the frozen workflow create-release job",
              "terminal job delegates verification authority to scripts.release_wallclock from tooling_sha",
              "JUnit and output inventory are retained as baseline-test-output-* artifacts without PYTEST_ADDOPTS"
            ],
            "local_integration_points": {
              "native_root": "wallclock-native-root",
              "docs_root": "wallclock-docs-root",
              "python_root": "wallclock-python-root",
              "test_output_root": "wallclock-test-output",
              "adapter_manifest": "wallclock-proof/baseline-adapter-manifest.json",
              "proof_json": "wallclock-proof/proof.json",
              "job_observer_json": "wallclock-proof/baseline-terminal-job.json",
              "proof_artifact": "wallclock-baseline-proof-1",
              "queue_inclusive_measurement": "workflow_created_at to GitHub terminal job completed_at",
              "run_started_at_source": "Actions workflow-run API run_started_at"
            }
          }
          MANIFEST

      - name: Record baseline terminal observer
        run: >-
          python -m scripts.release_wallclock record-job
          --side baseline
          --source-root "${GITHUB_WORKSPACE}/baseline-frozen-source"
          --source-sha "${BASELINE_FROZEN_MAIN_SHA}"
          --output "${GITHUB_WORKSPACE}/wallclock-proof/baseline-terminal-job.json"
        working-directory: wallclock-tooling

      - name: Verify baseline wall-clock artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.release_wallclock verify
          --side baseline
          --source-root "${GITHUB_WORKSPACE}/baseline-frozen-source"
          --source-sha "${BASELINE_FROZEN_MAIN_SHA}"
          --native-root "${GITHUB_WORKSPACE}/wallclock-native-root"
          --docs-root "${GITHUB_WORKSPACE}/wallclock-docs-root"
          --python-root "${GITHUB_WORKSPACE}/wallclock-python-root"
          --output "${GITHUB_WORKSPACE}/wallclock-proof/proof.json"
        working-directory: wallclock-tooling

      - name: Upload baseline wall-clock proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wallclock-baseline-proof-1
          path: wallclock-proof
          if-no-files-found: error
