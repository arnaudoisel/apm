name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - docs/**
      - .gitignore
      - LICENSE
  schedule:
    - cron: '0 4 * * *'
  repository_dispatch:
    types: [manual-build-release]

permissions:
  contents: read

jobs:
  plan:
    name: Resolve Release Candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      full_validation: ${{ steps.plan.outputs.full_validation }}
      candidate_run_id: ${{ steps.plan.outputs.candidate_run_id }}
      candidate_artifact_ids: ${{ steps.plan.outputs.candidate_artifact_ids }}
      candidate_evidence_artifact_id: ${{ steps.plan.outputs.candidate_evidence_artifact_id }}
      is_prerelease: ${{ steps.plan.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve exact-SHA qualification or build fresh
        id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { plan } = require('./scripts/release-candidate.cjs');
            await plan({ github, context, core });

  # The existing source CI is also a required candidate authority. Calling the
  # same workflow keeps lint, architecture, coverage, red-team and lifecycle
  # gates from drifting into a second, weaker release-only implementation.
  candidate-checks:
    name: Candidate Source Checks
    needs: [plan]
    if: needs.plan.outputs.full_validation == 'true' && needs.plan.outputs.candidate_run_id == ''
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Each reusable invocation has its own build -> integration/validation edges.
  # A slow Windows unit or installer test cannot hold Linux integration idle.
  platforms:
    name: ${{ matrix.binary_name }}
    needs: [plan]
    if: needs.plan.outputs.candidate_run_id == ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/release-platform.yml
    with:
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      binary-name: ${{ matrix.binary_name }}
      integration-markers: ${{ matrix.integration_markers }}
      integration-shard-count: ${{ matrix.integration_shard_count }}
      integration-xdist-workers: ${{ matrix.integration_xdist_workers }}
      integration-splitting-algorithm: ${{ matrix.integration_splitting_algorithm }}
      full-validation: ${{ needs.plan.outputs.full_validation == 'true' }}
    secrets:
      GH_CLI_PAT: ${{ secrets.GH_CLI_PAT }}
      GH_MODELS_PAT: ${{ secrets.GH_MODELS_PAT }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

  candidate-ready:
    name: Qualify Release Candidate
    needs: [plan, platforms, candidate-checks]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.plan.outputs.full_validation == 'true' &&
      needs.plan.outputs.candidate_run_id == '' &&
      needs.platforms.result == 'success' &&
      needs.candidate-checks.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      candidate_artifact_ids: ${{ steps.qualification.outputs.candidate_artifact_ids }}
      candidate_evidence_artifact_id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-${{ github.run_attempt }}-apm-*
          path: candidate-artifacts
      - name: Record complete candidate evidence
        id: qualification
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { qualify } = require('./scripts/release-candidate.cjs');
            await qualify({ github, context, core, artifactRoot: 'candidate-artifacts' });
      - id: evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-evidence-${{ github.run_attempt }}
          path: release-candidate-evidence.json
          if-no-files-found: error
          retention-days: 30

  verify-candidate:
    name: Verify Publication Inputs
    needs: [plan, platforms, candidate-checks, candidate-ready]
    if: >-
      always() && !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.plan.result == 'success' &&
      (needs.plan.outputs.candidate_run_id != '' ||
       (needs.platforms.result == 'success' && needs.candidate-checks.result == 'success' &&
        needs.candidate-ready.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact immutable download identities
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_IDS: ${{ needs.plan.outputs.candidate_artifact_ids || needs.candidate-ready.outputs.candidate_artifact_ids }}
          EVIDENCE_ID: ${{ needs.plan.outputs.candidate_evidence_artifact_id || needs.candidate-ready.outputs.candidate_evidence_artifact_id }}
        with:
          script: |
            const ids = process.env.ARTIFACT_IDS.split(',');
            if (ids.length !== 5 || new Set(ids).size !== 5 ||
                ids.some(id => !/^[1-9][0-9]*$/.test(id)) ||
                !/^[1-9][0-9]*$/.test(process.env.EVIDENCE_ID)) {
              throw new Error('Complete immutable candidate artifact IDs are required before download');
            }
      - name: Download qualified evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.candidate_evidence_artifact_id || needs.candidate-ready.outputs.candidate_evidence_artifact_id }}
          run-id: ${{ needs.plan.outputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: candidate-evidence
      - name: Download exact candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.plan.outputs.candidate_artifact_ids || needs.candidate-ready.outputs.candidate_artifact_ids }}
          run-id: ${{ needs.plan.outputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: candidate-artifacts
      - name: Verify identity and archive bytes before publication
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATE_RUN_ID: ${{ needs.plan.outputs.candidate_run_id || github.run_id }}
        with:
          script: |
            const { verify } = require('./scripts/release-candidate.cjs');
            await verify({
              github, context, core,
              runId: process.env.CANDIDATE_RUN_ID,
              artifactRoot: 'candidate-artifacts',
              evidencePath: 'candidate-evidence',
              outputRoot: 'release-assets'
            });
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-release-assets-${{ github.run_attempt }}
          path: release-assets/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  build-docs-artifact:
    name: Build Docs Artifact
    needs: [plan]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.plan.outputs.is_prerelease != 'true'
    uses: ./.github/workflows/docs-build.yml
    permissions:
      contents: read
    with:
      pages_artifact_name: docs-pages-${{ github.run_attempt }}
      upload_pages_artifact: true

  build-pypi-distributions:
    name: Build PyPI Distributions
    needs: [plan]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      github.event.repository.private != true &&
      needs.plan.outputs.is_prerelease != 'true'
    uses: ./.github/workflows/pypi-distributions.yml
    permissions:
      contents: read
    with:
      artifact_name: pypi-distributions-${{ github.run_attempt }}
      upload_artifact: true

  create-release:
    name: Create GitHub Release
    needs: [plan, verify-candidate]
    if: >-
      always() && !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.plan.result == 'success' && needs.verify-candidate.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      is_prerelease: ${{ needs.plan.outputs.is_prerelease }}
      is_private_repo: ${{ github.event.repository.private }}
    steps:
      # The write-token job neither checks out nor executes candidate code.
      - name: Download verified release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-release-assets-${{ github.run_attempt }}
          path: release-assets
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ needs.plan.outputs.is_prerelease == 'true' }}
          files: |
            release-assets/apm-linux-x86_64.tar.gz
            release-assets/apm-linux-x86_64.tar.gz.sha256
            release-assets/apm-linux-arm64.tar.gz
            release-assets/apm-linux-arm64.tar.gz.sha256
            release-assets/apm-darwin-x86_64.tar.gz
            release-assets/apm-darwin-x86_64.tar.gz.sha256
            release-assets/apm-darwin-arm64.tar.gz
            release-assets/apm-darwin-arm64.tar.gz.sha256
            release-assets/apm-windows-x86_64.zip
            release-assets/apm-windows-x86_64.zip.sha256

  daily-release-smoke-signal:
    name: Daily Release Smoke Signal
    needs: [plan, platforms, candidate-checks, candidate-ready]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: File or recover daily smoke issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { main } = require('./scripts/daily-release-smoke-signal.cjs');
            await main({ github, context, core });

  deploy-docs:
    name: Deploy Docs
    needs: [create-release, build-docs-artifact]
    if: >-
      always() && !cancelled() && needs.create-release.result == 'success' &&
      needs.build-docs-artifact.result == 'success' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.create-release.outputs.is_prerelease != 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: docs-pages-${{ github.run_attempt }}

  gh-aw-compat:
    name: GH-AW Compatibility
    needs: [create-release]
    if: >-
      always() && !cancelled() && needs.create-release.result == 'success' &&
      github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Install and pack with apm-action
        uses: microsoft/apm-action@d723bb64ed70c135bbaf87d126b721dd2dae0439 # v1.10.0
        id: pack
        with:
          dependencies: |
            - microsoft/apm-sample-package
          isolated: 'true'
          pack: 'true'
          archive: 'true'
          target: claude
          apm-version: ${{ github.ref_name }}
          working-directory: /tmp/gh-aw-compat-test
      - name: Verify bundle
        env:
          BUNDLE_PATH: ${{ steps.pack.outputs.bundle-path }}
        run: test -f "$BUNDLE_PATH"
      - name: Warn on failure
        if: failure()
        run: echo "::warning::GH-AW compatibility failed; investigate the external dependency before the next release."

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: [create-release, build-pypi-distributions]
    if: >-
      always() && !cancelled() && needs.create-release.result == 'success' &&
      needs.build-pypi-distributions.result == 'success' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      needs.create-release.outputs.is_private_repo != 'true' &&
      needs.create-release.outputs.is_prerelease != 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/apm-cli
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions-${{ github.run_attempt }}
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          verbose: true
